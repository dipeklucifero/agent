[project]
name = "hermes-agent"
version = "0.1.0"
description = "Personal Hermes-powered Telegram agent for Web3 ops and social automation"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # LLM
    "openai>=1.40.0",                 # OpenRouter uses OpenAI-compatible API

    # Telegram
    "python-telegram-bot[job-queue]>=21.0",
    "telethon>=1.36.0",               # optional userbot for group joins

    # Web3 - EVM
    "web3>=6.20.0",
    "eth-account>=0.13.0",

    # Web3 - Solana
    "solana>=0.34.0",
    "solders>=0.21.0",

    # X (Twitter) - cookie-session, no browser needed
    "twikit>=2.0.0",

    # Discord
    "discord.py>=2.4.0",

    # Scheduling (SQLAlchemy used by the persistent jobstore)
    "apscheduler>=3.10.4",
    "sqlalchemy>=2.0.0",

    # Config / validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",

    # Crypto for keystore
    "cryptography>=43.0.0",

    # HTTP
    "httpx>=0.27.0",

    # Logging
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
hermes-agent = "agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
